[package]
name = "record-ui"
version = "0.1.0"
edition = "2021"
description = "Native frontend for wf-recorder on Hyprland / wlroots"
license = "MIT"
publish = false

[lib]
name = "record_ui"
path = "src/lib.rs"

[[bin]]
name = "record-ui"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# GUI path only (`record-ui gui`); CLI paths never call adw/gtk init.
gtk4 = "0.9"
libadwaita = "0.7"
