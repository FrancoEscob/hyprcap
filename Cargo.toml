[package]
name = "hyprcap"
version = "0.1.0"
edition = "2021"
description = "Lightweight Rust + GTK4 screen recorder UI for Hyprland (wf-recorder)"
license = "MIT"
publish = false
repository = "https://github.com/FrancoEscob/hyprcap"
readme = "README.md"
keywords = ["hyprland", "wayland", "screen-recorder", "wf-recorder"]
categories = ["multimedia"]

[lib]
name = "hyprcap"
path = "src/lib.rs"

[[bin]]
name = "hyprcap"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# GUI path only (`hyprcap gui`); CLI paths never call adw/gtk init.
gtk4 = "0.9"
libadwaita = "0.7"
